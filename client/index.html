<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO -->
    <title>ReviewBoost — NFC kortelė daugiau Google atsiliepimų</title>
    <meta name="description" content="ReviewBoost NFC kortelė leidžia klientams palikti Google atsiliepimą vienu telefono bakstelėjimu. Paprasta, greita, efektyvu." />
    <meta name="keywords" content="Google atsiliepimai, NFC kortelė, verslo atsiliepimai, ReviewBoost, review card" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReviewBoost — NFC kortelė daugiau Google atsiliepimų" />
    <meta property="og:description" content="ReviewBoost NFC kortelė leidžia klientams palikti Google atsiliepimą vienu telefono bakstelėjimu." />
    <meta property="og:image" content="/src/assets/images/logo.png" />
    <meta property="og:locale" content="lt_LT" />
    <meta property="og:locale:alternate" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReviewBoost — NFC kortelė daugiau Google atsiliepimų" />
    <meta name="twitter:description" content="ReviewBoost NFC kortelė leidžia klientams palikti Google atsiliepimą vienu telefono bakstelėjimu." />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    
    <!-- Prevent theme flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('reviewboost-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
